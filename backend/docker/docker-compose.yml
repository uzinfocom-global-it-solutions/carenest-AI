services:
  backend:
    build:
      context: ..
      dockerfile: docker/.Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__BackendDb: "Host=postgres;Port=5432;Database=carenest;Username=carenest;Password=${POSTGRES_PASSWORD:-carenest_dev_pass}"
      ConnectionStrings__Redis: "redis:6379"
      Cors__AllowedOrigins: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-dev-only-secret-key-CHANGE-IN-PROD-must-be-32-chars-minimum!!}"
      Jwt__Issuer: "CareNest"
      Jwt__Audience: "CareNest"
      Jwt__AccessTokenExpiryMinutes: "15"
      Jwt__RefreshTokenExpiryDays: "30"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/alive || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - carenest-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: carenest
      POSTGRES_USER: carenest
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-carenest_dev_pass}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carenest -d carenest"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - carenest-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - carenest-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@carenest.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    networks:
      - carenest-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  carenest-network:
    driver: bridge
